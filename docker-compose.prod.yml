# Token Heatmap — 生产部署（独立镜像，不依赖宿主 bind mount）
#
# 与 docker-compose.yml 的区别：
# - 使用镜像内自带的 app/ 与 themes/（Dockerfile 已 COPY），无需挂载宿主源码
# - 只读根文件系统 + /tmp tmpfs + 非 root 用户 + no-new-privileges
# - THEMES_DIR 指向镜像内 /app/themes（修改主题需重新构建镜像或改为挂载）
#
# 用法：
#   docker compose -f docker-compose.prod.yml up -d --build
#   多实例：docker compose -p token-heatmap-b -f docker-compose.prod.yml up -d（并在 .env 设置 HOST_PORT）
name: token-heatmap

services:
  token-heatmap:
    build:
      context: .
      dockerfile: Dockerfile
    image: token-heatmap:uv
    restart: unless-stopped
    init: true
    working_dir: /app
    ports:
      - "127.0.0.1:${HOST_PORT:-3004}:8000"
    env_file:
      - .env
    environment:
      - THEMES_DIR=/app/themes
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - heatmap-net
    # healthcheck: python:3.12-slim 无 curl，用 python urllib；readyz 反映数据源配置就绪
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/token/readyz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 外部网络通过环境变量指定（兼容不同部署环境）：
#   默认 proxy-network；1Panel 等环境在 .env 设 NETWORK_NAME=1panel-network
networks:
  heatmap-net:
    name: ${NETWORK_NAME:-proxy-network}
    external: true
