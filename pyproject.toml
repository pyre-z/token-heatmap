[project]
name = "token-heatmap"
version = "0.1.0"
description = "FastAPI SVG token heatmap"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "psycopg2-binary",
    "sqlmodel",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
